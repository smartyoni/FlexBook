<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1E293B"/>
  <circle cx="100" cy="100" r="90" fill="url(#gradient)"/>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Flex book icon -->
  <g transform="translate(100, 100)">
    <!-- Left part: F for Flex -->
    <path d="M -30 -25 L -30 35 L -5 35 L -5 25 L 5 25 L 5 15 L -5 15 L -5 -15 L 10 -15 L 10 -25 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>

    <!-- Right part: Book pages -->
    <g>
      <path d="M 15 -25 L 35 -18 L 35 38 L 15 31 Z"
            fill="#DBEAFE" opacity="0.8" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 15 -25 L 35 -18 L 35 38 L 15 31 Z"
            fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Book fold lines -->
      <line x1="15" y1="-25" x2="35" y2="-18" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
      <line x1="15" y1="-5" x2="35" y2="2" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
      <line x1="15" y1="15" x2="35" y2="22" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
      <line x1="15" y1="31" x2="35" y2="38" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Decorative dots (financial chart concept) -->
    <circle cx="-15" cy="15" r="2" fill="#FCD34D" opacity="0.9"/>
    <circle cx="-8" cy="5" r="2" fill="#FCD34D" opacity="0.9"/>
    <circle cx="-2" cy="10" r="2" fill="#FCD34D" opacity="0.9"/>
  </g>
</svg>